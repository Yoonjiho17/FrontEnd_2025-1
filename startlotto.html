<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>로또 번호 생성기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <span class="headingtext">로또 번호 생성기</span>
            <span class="headingtextsub">행운의 번호를 생성해보세요!</span>
        </header>
        <div class="bodybox">
            <div class="makelottobox">
                <span class="makenumtext">번호 생성</span>
                <div class="circlebox">
                    <span class="circle1">?</span>
                    <span class="circle2">?</span>
                    <span class="circle3">?</span>
                    <span class="circle4">?</span>
                    <span class="circle5">?</span>
                    <span class="circle6">?</span>
                </div>
                <button>번호 생성하기</button>
            </div>
            <div class="buylottobox">
                <span class="buylottotext">로또 구매하기</span>
                <div class="inputbox">
                    <span class="buyamounttext">구매 수량:</span>
                    <input>
                </div>
                <span class="totaltext">총 금액: 0원 (1장당 1,000원)</span>
                <button>구매하기</button>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
